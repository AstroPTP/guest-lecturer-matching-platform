name: Feature request
description: Suggest a new feature or a change to how something works.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Main site (frontend/)
        - Admin portal (frontend/admin/)
        - API (backend/)
        - Database schema or migrations (backend/prisma/)
        - Docker, deployment or CI
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      multiple: true
      options:
        - Guest speakers
        - Unit coordinators
        - CCAE administrators
        - Developers or maintainers

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the need, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you think it should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, screenshots, links.
