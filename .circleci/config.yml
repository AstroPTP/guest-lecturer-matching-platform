# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  backend:
    docker:
      - image: cimg/node:22.11   # pinned to match .nvmrc, not "current"
    steps:
      - checkout   # checks out to the job's default working_directory (~/project)
      - restore_cache:
          # See the configuration reference documentation for more details on using restore_cache and save_cache steps
          # https://circleci.com/docs/reference/configuration-reference/?section=reference#save_cache
          keys:
            - backend-deps-v1-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
      - run:
          name: Install packages
          command: npm ci
          working_directory: backend
      - save_cache:
          key: backend-deps-v1-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
          working_directory: backend
      - run:
          name: Run tests
          command: npm run test
          working_directory: backend
      - run:
          name: Build
          command: npm run build
          working_directory: backend

  frontend:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ .Branch }}-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install packages
          command: npm ci
          working_directory: frontend
      - save_cache:
          key: frontend-deps-v1-{{ .Branch }}-{{ checksum "frontend/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
          working_directory: frontend
      - run:
          name: Build
          command: npm run build
          working_directory: frontend

workflows:
# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
  lint-test-build:
    jobs:
      - backend
      - frontend